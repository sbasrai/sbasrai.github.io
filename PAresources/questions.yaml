  - id: Q6
    text: "What water horsepower (whp) is required for a pump that delivers 650 gpm to a total head of 195 feet?"
    type: multiple_choice
    choices:
      a: "25 whp"
      b: "30 whp"
      c: "32 whp"
      d: "40 whp"
    correct: c
    solution: |
      Use water horsepower: whp = (Q * H) / 3960
      Q = 650 gpm, H = 195 ft
      whp = (650 × 195) / 3960 = 126,750 / 3,960 ≈ 32.0 whp → 32 whp (choice c)
    level: 3
    topic: Pumping