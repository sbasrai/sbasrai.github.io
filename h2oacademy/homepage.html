<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>H2O Academy — Preparing Water Professionals for Success</title>
  <style>
    :root{--brand:#1b65d4;--nav:#0f2c52;--ink:#0b1b2b;--muted:#4a5d75;--line:#e6eef7;--bg:#f6f9fe;--white:#fff}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
    header.top{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
    .nav{display:flex;align-items:center;gap:16px;padding:14px 0}
    .nav > nav{margin:0 auto;display:flex;gap:18px;align-items:center}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;flex:0 0 auto}
    .logo{width:32px;height:32px;border-radius:8px;background:var(--brand)}
    .brandname{font-size:20px;letter-spacing:.4px;color:var(--brand)}
    nav a{padding:10px 12px;border-radius:10px}
    nav a:hover{background:var(--brand);color:#fff}
    .hero{position:relative;isolation:isolate}
    .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,24,44,.15) 0%, rgba(10,24,44,.45) 55%, rgba(10,24,44,.65) 100%), url('https://images.unsplash.com/photo-1567067977901-30eb1c3718d6?q=80&w=1954&auto=format&fit=crop') center/cover no-repeat;z-index:-1}
    .hero-inner{padding:72px 0 60px;color:#fff}
    .hero h1{font-size:clamp(32px,6vw,56px);line-height:1.06;margin:8px 0 8px;text-shadow:0 2px 18px rgba(0,0,0,.28)}
    .sub{font-size:clamp(16px,2.4vw,20px);max-width:1060px;color:#e9f2ff;margin:10px 0 26px}
    .cta{display:flex;gap:16px;flex-wrap:wrap}
    .btn{display:inline-block;padding:14px 18px;border-radius:14px;border:2px solid #203b63;background:#203b63;color:#fff;font-weight:800;box-shadow:0 6px 24px rgba(0,0,0,.18);transition:.15s}
    .btn.alt{background:transparent;border-color:#e9f2ff;color:#fff}
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(0,0,0,.08);}
    .btn:focus{outline:3px solid rgba(27,101,212,.35);outline-offset:2px;}
    section.section{padding:64px 0;}
    @media (max-width:600px){section.section{padding:40px 0;}}
    h2{font-size:30px;margin:0 0 12px}
    .lead{color:var(--muted)}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.06);}
    .card-link{color:var(--brand);font-weight:bold}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
    @media (max-width:980px){.grid-3{grid-template-columns:repeat(2,1fr);}}
    @media (max-width:600px){.grid-3{grid-template-columns:1fr;}}
    :target{scroll-margin-top:90px;}
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <div class="brand" aria-label="H2O Academy brand">
        <img src="TLogo1.png" alt="H2O Academy Logo" class="logo" />
        <span class="brandname">H2O ACADEMY</span>
      </div>
      <nav aria-label="Main">
        <a href="homepage.html">Home</a>
        <a href="PublicAgencies.html">Public Agencies</a>
        <a href="Students.html">Students</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section id="home" class="hero">
    <div class="wrap hero-inner">
      <h1>Preparing Water Professionals <span class="break">for Success</span></h1>
      <p class="sub">Training the next generation of water treatment and distribution operators while advancing the skills of today’s workforce.</p>
      <div class="cta">
        <a class="btn" href="./PublicAgencies.html">For Public Agencies</a>
        <a class="btn" href="./Students.html">For Students</a>
      </div>
    </div>
  </section>
</body>
</html>
